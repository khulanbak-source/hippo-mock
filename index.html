<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1f6f5c" />
  <title>My Little Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Comfortaa:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./hub.css" />
</head>
<body class="hub-body">
<div id="app">
  <button id="btn-lang" class="lang-toggle" type="button">EN</button>

  <!-- ===== LOGIN ===== -->
  <section id="h-login" class="screen active">
    <div class="card login-card">
      <div class="hippo-logo">🎒</div>
      <h1>My Little Test</h1>
      <p class="muted" data-i18n="loginSub"></p>
      <form id="h-login-form" autocomplete="off">
        <label for="h-name" data-i18n="lblName"></label>
        <input id="h-name" name="name" type="text" autocomplete="off" autocapitalize="words"
               autocorrect="off" spellcheck="false" required />
        <label for="h-code" data-i18n="lblCode"></label>
        <input id="h-code" name="code" type="text" inputmode="numeric" pattern="[0-9]*"
               autocomplete="off" required />
        <button type="submit" id="h-btn-login" class="btn btn-primary big" data-i18n="btnLogin"></button>
        <p id="h-msg" class="form-msg" role="status"></p>
      </form>
      <p class="disclaimer" data-i18n="disclaimer"></p>
    </div>
  </section>

  <!-- ===== LIBRARY ===== -->
  <section id="h-library" class="screen">
    <div class="card library-card">
      <h2 id="h-hi"></h2>
      <p class="muted small" data-i18n="pickSub"></p>
      <div id="h-tiles" class="tiles"></div>
      <p class="muted small" id="h-locked-note"></p>
      <button id="h-logout" class="btn btn-ghost" data-i18n="btnLogout"></button>
    </div>
  </section>
</div>
<script src="./session.js"></script>
<script src="./hub.js"></script>
</body>
</html>
